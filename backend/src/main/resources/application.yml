server:
  port: 8080
  tomcat:
    # 멀티에이전트 SSE 스트리밍은 agent별 생성으로 오래 걸린다 → 커넥션 idle 타임아웃을 길게 둔다.
    connection-timeout: ${SERVER_TOMCAT_CONNECTION_TIMEOUT:600000}

spring:
  mvc:
    async:
      # SseEmitter/Flux 스트리밍이 전체 완료까지 끊기지 않도록 비동기 요청 타임아웃을 길게 둔다.
      request-timeout: ${SPRING_MVC_ASYNC_REQUEST_TIMEOUT:1800000}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:capstone}
    username: ${DB_USER:capstone}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

ai:
  server:
    fastapi:
      # Source of Truth = docker-compose.yml spring.environment (FASTAPI_PRIMARY_BASE_URL / FASTAPI_SECONDARY_BASE_URL).
      #  base-url 은 레거시 호환 키: 다른 서비스들이 쓰는 fastApiWebClient 는 항상 PRIMARY 를 가리킨다.
      base-url: ${FASTAPI_PRIMARY_BASE_URL:${FASTAPI_BASE_URL:http://localhost:8000}}
      # PRIMARY = ai07(reverse SSH 터널 :18000). SECONDARY = EC2 로컬 hot-standby FastAPI(:8000). 비우면 secondary 비활성.
      primary-base-url: ${FASTAPI_PRIMARY_BASE_URL:${FASTAPI_BASE_URL:http://localhost:8000}}
      secondary-base-url: ${FASTAPI_SECONDARY_BASE_URL:}
      # 멀티에이전트 채팅 failover 정책 (AiMultiChatFailoverService). 하드코딩 금지 — env 제어.
      failover:
        # 동일 업스트림 최대 시도 횟수(첫 이벤트 수신 전 실패에만 적용). 무한 retry 금지.
        attempts-per-upstream: ${AI_STREAM_ATTEMPTS_PER_UPSTREAM:2}
        backoff-ms: ${AI_STREAM_BACKOFF_MS:400}
        # 실패한 업스트림을 잠시 건너뛰는 냉각 시간. 만료 후 자동 재시도 → ai07 복구 시 수동 조치 없이 PRIMARY 복귀.
        circuit-cooldown-seconds: ${AI_UPSTREAM_CIRCUIT_COOLDOWN_SECONDS:15}
        # /openapi.json 라우트 표면 프로브 주기. stream 라우트 부재(=구버전 회귀)면 해당 업스트림 stream 을 건너뛴다.
        probe-interval-seconds: ${AI_UPSTREAM_PROBE_INTERVAL_SECONDS:15}
        # 이벤트 간 무응답 상한(ai07 heartbeat 10s) — 끊긴 터널을 감지해 failover.
        stream-idle-timeout-seconds: ${AI_STREAM_IDLE_TIMEOUT_SECONDS:180}
        # 사용자 응답 전체 상한. 초과 시 error+done 으로 정상 종료(500 금지).
        total-timeout-seconds: ${AI_STREAM_TOTAL_TIMEOUT_SECONDS:900}
      # FastAPI /api/ai/multi-chat/stream 은 agent별 순차 생성으로 오래 걸린다 → read 타임아웃을 길게 둔다.
      read-timeout-seconds: ${AI_SERVER_FASTAPI_READ_TIMEOUT_SECONDS:1800}
      # 키워드 정의 / 플래너 AI 확장 / 플래너 로드맵 호출 타임아웃 (초). 하드코딩 금지 — env 제어.
      keyword-define-timeout-seconds: ${AI_KEYWORD_DEFINE_TIMEOUT_SECONDS:60}
      planner-expand-timeout-seconds: ${AI_PLANNER_EXPAND_TIMEOUT_SECONDS:120}
      roadmap-timeout-seconds: ${AI_ROADMAP_TIMEOUT_SECONDS:180}
      # 학습일지(자료보관함 메모탭) 검증 호출. 장애/타임아웃 시 Spring 로컬 폴백(보수적: 꼬리개념 확장 자동 ACCEPT 금지).
      study-journal:
        validate-path: ${AI_STUDY_JOURNAL_VALIDATE_PATH:/api/ai/study-journal/validate}
        timeout-seconds: ${AI_STUDY_JOURNAL_TIMEOUT_SECONDS:20}
    # Spring → FastAPI 내부 인증키(설정 시 Authorization: Bearer 로 전달). 코드 하드코딩 금지.
    api-key: ${AI_SERVER_API_KEY:}
  # Intent Router: AI 채팅(자료보관함/그룹스터디/학습메이트) 앞단 분기. ai07 /api/ai/intent/route 호출.
  # base-url 미지정 시 기존 FastAPI 베이스 사용(EC2=host.docker.internal:18000). 실패 시 PROCEED 폴백.
  intent-router:
    enabled: ${AI_INTENT_ROUTER_ENABLED:false}
    base-url: ${AI_INTENT_ROUTER_BASE_URL:${FASTAPI_BASE_URL:http://localhost:8000}}
    timeout-ms: ${AI_INTENT_ROUTER_TIMEOUT_MS:6000}
    path: ${AI_INTENT_ROUTER_PATH:/api/ai/intent/route}
    # ai07 라우터가 비활성/장애(미배포 404)일 때 EC2 로컬 결정적 분류기로 폴백:
    #   인사/자기소개/잡담→DIRECT_REPLY, 욕설/공격성→BLOCK, 그 외 학습질문→PROCEED.
    local-fallback-enabled: ${AI_INTENT_ROUTER_LOCAL_FALLBACK_ENABLED:true}

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
    region:
      static: ${AWS_REGION:eu-west-3}
    s3:
      bucket: ${AWS_S3_BUCKET:studybridge-materials}

external-api:
  fastapi:
    url: ${FASTAPI_EXTRACTION_URL:http://localhost:8000/api/extract}
    timeout: ${FASTAPI_TIMEOUT:30000}

jwt:
  secret: ${JWT_SECRET:studybridge_super_secret_key_for_jwt_token_generation_2026_spring_boot_3_security_6}
  expiration-ms: ${JWT_EXPIRATION_MS:1800000}

