server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:capstone}
    username: ${DB_USER:capstone}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

ai:
  server:
    fastapi:
      base-url: ${FASTAPI_BASE_URL:http://localhost:8000}

jwt:
  secret: ${JWT_SECRET:studybridge_super_secret_key_for_jwt_token_generation_2026_spring_boot_3_security_6}
  expiration-ms: ${JWT_EXPIRATION_MS:1800000} # 30분 (30 * 60 * 1000)
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7일 (7 * 24 * 60 * 60 * 1000)