server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:capstone}
    username: ${DB_USER:capstone}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

ai:
  server:
    fastapi:
      base-url: ${AI_SERVER_BASE_URL:http://127.0.0.1:18000}
      api-key: ${AI_SERVER_API_KEY:studybridge_ai_secret}

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
    region:
      static: ${AWS_REGION:eu-west-3}
    s3:
      bucket: ${AWS_S3_BUCKET:studybridge-materials}

external-api:
  fastapi:
    url: ${AI_SERVER_BASE_URL:http://127.0.0.1:18000}/api/extract
    timeout: ${FASTAPI_TIMEOUT:30000}

jwt:
  secret: ${JWT_SECRET:studybridge_super_secret_key_for_jwt_token_generation_2026_spring_boot_3_security_6}
  expiration-ms: ${JWT_EXPIRATION_MS:1800000}
