# Redis 대화기억 주소 오버라이드 (P6)
#
# systemd 사양 주의: drop-in 의 Environment= 는 유닛의 EnvironmentFile= 에 진다.
# systemd 가 EnvironmentFile 을 나중에 읽어 Environment 값을 덮어쓰기 때문이다.
# 그래서 repo 의 fastapi/.env (REDIS_URL=redis://capstone-redis:6379/0, EC2 도커
# 내부 이름이라 ai07 에서 해석 불가) 를 이기려면 '나중에 선언된 EnvironmentFile' 이어야 한다.
# CLAUDE.md 가 .env 편집을 금지하므로 별도 파일로 우회한다.
[Unit]
Wants=studybridge-redis-tunnel.service
After=studybridge-redis-tunnel.service

[Service]
EnvironmentFile=/etc/studybridge/ai-overrides.env
