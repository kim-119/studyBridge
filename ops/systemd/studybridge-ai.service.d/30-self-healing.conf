# studybridge-ai self-healing (P1/P8)
#
# 재시작 정책이 두 종류로 갈리는 이유:
#   AI 서버 = StartLimit 을 건다. :8000 을 외부 프로세스가 물면 아무리 재시작해도
#             바인딩에 실패한다. 무한 루프 대신 failed 상태로 멈춰 operator 를 부른다.
#             (2026-09-07 장애 때 25,748회 헛재시작했다)
#   터널     = StartLimit 을 푼다. 네트워크 단절은 기다리면 낫는다. 영원히 재시도해야 한다.
[Unit]
After=network-online.target ollama.service
Wants=network-online.target ollama.service
# Ollama 는 기능상 critical 이지만 Requires= 로 묶지 않는다.
# Ollama 가 죽었다고 FastAPI 까지 못 뜨면 헬스체크가 원인을 보고할 수단조차 사라진다.
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=5
TimeoutStartSec=120
# 포트 점유 가드. 외부 프로세스가 물고 있으면 여기서 실패시켜 루프를 막는다.
ExecStartPre=+/usr/local/bin/studybridge-ai-preflight.sh
