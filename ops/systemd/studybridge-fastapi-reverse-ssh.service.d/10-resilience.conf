# 리버스 터널 복원력 (P7)
#
# 기본 StartLimitBurst(10초에 5회)가 걸려 있으면, EC2 가 잠깐 안 잡히는 동안 ssh 가
# 빠르게 5번 죽고 유닛이 failed 로 굳는다. 그러면 EC2 :18000 이 영구히 끊긴다.
# 터널은 무한 재시도가 정답이다.
#
# 주의: FastAPI 재시작과 터널을 결합하지 않는다(BindsTo/PartOf 금지).
# 로컬 :8000 이 다시 뜨면 기존 리버스 터널이 그대로 전달을 재개한다.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5
