# ── StudyBridge 호스트: studybridge.co.kr(데스크톱/정식) + m.studybridge.co.kr(모바일 웹) ──────────
#  설치: sudo cp ops/nginx/studybridge-sites.conf /etc/nginx/sites-available/studybridge  (sites-enabled 심볼릭 링크 유지)
#  · 정식 서비스 호스트는 studybridge.co.kr. 포스터 QR(https://studybridge.co.kr/)은 그대로 유지한다.
#  · m.studybridge.co.kr 은 같은 릴리즈·같은 /api 를 서빙하는 모바일 웹 진입점. 휴대전화 UA 의 문서 내비게이션만
#    apex → m. 으로 302(경로·쿼리 보존). m. → apex 리다이렉트는 존재하지 않는다(루프 불가).
#  · www.studybridge.co.kr 은 별칭으로 301 → apex 만 수행한다(서비스 제공 안 함).
#  · 그 외 Host(EC2 공인 IP, 과거 테스트 도메인 등)는 80은 444, 443은 TLS 핸드셰이크 자체를 거부한다.
#  · 인증서: /etc/letsencrypt/live/www.studybridge.co.kr (SAN: studybridge.co.kr, www.studybridge.co.kr, m.studybridge.co.kr)
#  · 공통 location 은 snippets/studybridge-site-common.conf, 모바일 UA map 은 conf.d/studybridge-mobile-ua.conf.

# 80: 미지정 Host 차단(default)
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# 80: 정식/별칭 → HTTPS apex (certbot --nginx http-01 챌린지는 이 블록에 임시 주입된다)
server {
    listen 80;
    server_name studybridge.co.kr www.studybridge.co.kr;

    return 301 https://studybridge.co.kr$request_uri;
}

# 80: 모바일 호스트 → HTTPS m. (경로 보존)
server {
    listen 80;
    server_name m.studybridge.co.kr;

    return 301 https://m.studybridge.co.kr$request_uri;
}

# 443: 미지정 SNI/Host 차단(default) — 인증서를 내주지 않고 핸드셰이크 거부
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# 443: www 별칭 → apex 301
server {
    listen 443 ssl;
    server_name www.studybridge.co.kr;

    ssl_certificate /etc/letsencrypt/live/www.studybridge.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.studybridge.co.kr/privkey.pem;

    return 301 https://studybridge.co.kr$request_uri;
}

# 443: 정식 서비스(데스크톱) — studybridge.co.kr. 휴대전화 UA 문서 요청은 snippet 안에서 m. 으로 302.
server {
    listen 443 ssl;
    server_name studybridge.co.kr;

    ssl_certificate /etc/letsencrypt/live/www.studybridge.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.studybridge.co.kr/privkey.pem;

    include snippets/studybridge-site-common.conf;
}

# 443: 모바일 웹 — m.studybridge.co.kr (같은 릴리즈·같은 백엔드, 리다이렉트 없음)
server {
    listen 443 ssl;
    server_name m.studybridge.co.kr;

    ssl_certificate /etc/letsencrypt/live/www.studybridge.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.studybridge.co.kr/privkey.pem;

    include snippets/studybridge-site-common.conf;
}
