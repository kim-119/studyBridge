# StudyBridge 모바일 웹 진입점(m.studybridge.co.kr) — http 컨텍스트 map 2종.
#   설치: sudo cp ops/nginx/studybridge-mobile-ua.conf /etc/nginx/conf.d/studybridge-mobile-ua.conf
#
#  1) $sb_ua_mobile : User-Agent 가 휴대전화 브라우저인가(1/0).
#     · Android WebView("; wv)") 는 제외 → Capacitor 앱(kr.co.studybridge.app)은 apex 를 그대로 로드한다
#       (capacitor.config.json allowNavigation 에 m. 이 없어 리다이렉트되면 외부 브라우저로 튕긴다).
#     · 태블릿(iPad/Android 비-Mobile)은 데스크톱 취급(두 호스트 모두 같은 번들·같은 반응형 CSS 라 UI 는 동일).
#     · 정규식은 선언 순서대로 첫 매치가 채택된다(nginx map 규칙) → WebView 제외 규칙을 맨 앞에 둔다.
map $http_user_agent $sb_ua_mobile {
    default 0;
    "~*\(.*;\s*wv\)"                                    0;
    "~*(iPhone|iPod|Windows Phone|BlackBerry|Opera Mini)" 1;
    "~*Android.*Mobile"                                 1;
}

#  2) $sb_mobile_redirect : 실제로 302 를 내보낼 요청인가.
#     조건 = Host 가 apex(studybridge.co.kr) + GET + 모바일 UA + "문서 내비게이션".
#     · 문서 내비게이션 판정: Sec-Fetch-Dest: document (Chrome, Safari 16.4+) 이거나,
#       Sec-Fetch-* 를 안 보내는 구형 브라우저는 Accept 에 text/html 이 포함된 경우.
#     · fetch/XHR/SSE(Accept: application/json, text/event-stream, */*)·WebSocket 업그레이드·이미지·스크립트는
#       조건을 만족하지 못해 절대 리다이렉트되지 않는다. (/api/, /ws-group, /openvidu/, /assets/, /downloads/ 는
#       별도 location 이라 이 변수와 무관하게 제외된다.)
#     · Host 가 m.studybridge.co.kr 이면 어떤 경우에도 0 → 루프 구조적으로 불가.
map "$host|$request_method|$sb_ua_mobile|$http_sec_fetch_dest|$http_accept" $sb_mobile_redirect {
    default 0;
    "~^studybridge\.co\.kr\|GET\|1\|document\|"      1;
    "~^studybridge\.co\.kr\|GET\|1\|\|.*text/html"   1;
}
