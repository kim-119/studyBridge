# StudyBridge SPA 서버 블록 공통부 — studybridge.co.kr(데스크톱) / m.studybridge.co.kr(모바일) 443 블록이 공유.
#   설치: sudo cp ops/nginx/studybridge-site-common.conf /etc/nginx/snippets/studybridge-site-common.conf
#   두 호스트는 같은 정적 릴리즈(/var/www/studybridge/current)·같은 Spring(/api)·같은 WS/OpenVidu 프록시를 쓴다.
#   모바일 302 는 $sb_mobile_redirect(conf.d/studybridge-mobile-ua.conf) 가 Host=apex 일 때만 1 이므로
#   m. 블록에 같은 snippet 을 include 해도 m. 에서는 절대 리다이렉트가 발생하지 않는다.

client_max_body_size 100M;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-XSS-Protection "1; mode=block" always;

# ── React 정적 빌드(dist) 직접 서빙 ──────────────────────────────
# 운영 프론트는 vite dev server(:3000) 프록시가 아니라
# /var/www/studybridge/current(릴리즈 심볼릭 링크)의 정적 파일을 직접 서빙한다.
root /var/www/studybridge/current;
index index.html;

# Spring REST API + SSE
location /api/ {
    proxy_pass http://127.0.0.1:8080/api/;
    proxy_http_version 1.1;
    # SSE/스트리밍: 업스트림 keepalive 위해 Connection 헤더 비움
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE 버퍼링/캐시/압축 비활성화 (text/event-stream 즉시 flush)
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    # JSON 응답은 압축한다(방 history 가 548KB 비압축으로 내려가던 문제). text/event-stream 은 gzip_types 에 없어
    # SSE 는 압축/버퍼링 없이 그대로 흐른다. gzip_proxied any 가 없으면 프록시 응답은 압축되지 않는다.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json text/plain application/javascript;
    add_header X-Accel-Buffering no always;
    add_header Cache-Control "no-cache, no-transform" always;
    # nginx add_header 는 location 에 하나라도 있으면 server 블록 헤더를 상속하지 않는다.
    # → /api/ 응답에서 보안 헤더가 빠지던 문제. server 블록과 동일하게 다시 명시한다.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;
    chunked_transfer_encoding off;
    proxy_connect_timeout 60s;
}

# Spring WebSocket / SockJS / STOMP
location /ws-group {
    proxy_pass http://127.0.0.1:8080/ws-group;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;
}

# OpenVidu HTTPS proxy
location /openvidu/ {
    proxy_pass http://127.0.0.1:14443/;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;
}

# 해시 파일명 정적 자산 — 장기 캐시(immutable)
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    access_log off;
    try_files $uri =404;
}

# index.html 은 절대 캐시하지 않는다(새 릴리즈 즉시 반영).
location = /index.html {
    if ($sb_mobile_redirect) { return 302 https://m.studybridge.co.kr$request_uri; }
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires -1;
}

# Android 앱 자체 배포: /api/app/ (버전 메타데이터, no-store) + /downloads/android/ (APK 302 → S3 presigned)
#  /app 은 별도 location 없이 아래 SPA 폴백이 index.html 을 내주고 React 라우트가 렌더한다.
include snippets/studybridge-android-downloads.conf;

# SPA 라우팅 — 정적 파일 우선, 없으면 index.html 폴백
#  모바일 브라우저의 문서 내비게이션(apex Host 일 때만)은 같은 경로·쿼리 그대로 m. 으로 302(캐시되지 않는 임시 리다이렉트).
location / {
    if ($sb_mobile_redirect) { return 302 https://m.studybridge.co.kr$request_uri; }
    try_files $uri $uri/ /index.html;
}
