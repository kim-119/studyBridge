# StudyBridge 검색엔진(SEO) 응답 제어 — http 컨텍스트 map 3종.
#   설치: sudo cp ops/nginx/studybridge-seo.conf /etc/nginx/conf.d/studybridge-seo.conf
#   사용처: snippets/studybridge-site-common.conf 의 `location = /index.html`(SPA 폴백 응답이 최종 생성되는 곳).
#
#  1) $sb_seo_path : 검색 노출을 허용하는 공개 경로(대표 경로로 정규화). 그 외는 "".
#     · $request_uri 는 SPA 폴백 내부 리다이렉트 후에도 원래 요청 경로를 유지한다.
#     · 원시 요청 경로를 HTML 에 그대로 넣지 않는다(헤더/HTML 주입 방지) — 허용 목록의 고정 값만 출력한다.
#     · frontend/public/sitemap.xml 의 URL 목록과 일치시킬 것.
map $request_uri $sb_seo_path {
    default "";
    "~^/(?:\?.*)?$"               "/";
    "~^/app/?(?:\?.*)?$"          "/app";
    "~^/login/?(?:\?.*)?$"        "/login";
    "~^/register/?(?:\?.*)?$"     "/register";
}

#  2) $sb_robots_tag : 공개 경로가 아닌 SPA 문서(로그인 필요 화면, 존재하지 않는 경로의 200 폴백, /index.html 직접 요청)는
#     X-Robots-Tag: noindex. 값이 비면 nginx 는 헤더를 보내지 않는다.
map $sb_seo_path $sb_robots_tag {
    ""      "noindex";
    default "";
}

#  3) $sb_seo_links : index.html 의 <!--sb:seo-links--> 자리에 넣을 태그.
#     · 데스크톱(apex): canonical=자기 자신 + 모바일 alternate(m.) — 별도 모바일 URL 구성(Google/Naver 권장 방식).
#     · 모바일(m.)   : canonical=같은 경로의 apex.
#     · 비공개/미허용 경로: 비움(noindex 로 충분, 모든 경로를 홈 canonical 로 고정하지 않는다).
map "$host|$sb_seo_path" $sb_seo_links {
    default "";
    "~^studybridge\.co\.kr\|(?<sb_p>/.*)$"   '<link rel="canonical" href="https://studybridge.co.kr$sb_p" /><link rel="alternate" media="only screen and (max-width: 640px)" href="https://m.studybridge.co.kr$sb_p" />';
    "~^m\.studybridge\.co\.kr\|(?<sb_p>/.*)$" '<link rel="canonical" href="https://studybridge.co.kr$sb_p" />';
}
