# StudyBridge Android 앱 자체 배포 — nginx 서버 블록(studybridge.co.kr:443) 안에 include 되는 스니펫.
#   설치: sudo cp ops/android/nginx-android-downloads.conf /etc/nginx/snippets/studybridge-android-downloads.conf
#         sites-available/studybridge 의 443 apex server 블록에 `include snippets/studybridge-android-downloads.conf;`
#         (location / SPA 폴백보다 앞) → sudo nginx -t && sudo systemctl reload nginx
#   · /app                → 별도 location 없음. SPA(try_files … /index.html) 가 그대로 서빙하고 React 라우트 /app 이 렌더한다.
#   · /api/app/           → Spring 공개 read-only 엔드포인트(버전 메타데이터·APK 302). 메타데이터는 절대 캐시하지 않는다.
#   · /downloads/android/ → 안정 다운로드 URL. Spring 이 S3 presigned URL 로 302 (실제 저장 위치 비노출, 서명 TTL 15분).
#   기존 /api/ /ws-group /openvidu/ /assets/ 라우팅은 건드리지 않는다(^~ 접두 매칭은 이 두 경로에만 적용).

# 버전 메타데이터·다운로드 리다이렉트 — no-store 단일 Cache-Control (Spring 의 헤더는 hide 하고 여기서 확정)
location ^~ /api/app/ {
    proxy_pass http://127.0.0.1:8080/api/app/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;

    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, no-cache, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;
}

# 안정 다운로드 URL → Spring /api/app/downloads/android/* (302 → S3 presigned)
#   /downloads/android/StudyBridge-latest.apk   항상 최신 (캐시 금지)
#   /downloads/android/StudyBridge-1.0.1.apk    버전 고정 (S3 객체는 immutable 1y, 리다이렉트 자체는 no-store)
location ^~ /downloads/android/ {
    proxy_pass http://127.0.0.1:8080/api/app/downloads/android/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;

    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, no-cache, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;
}
