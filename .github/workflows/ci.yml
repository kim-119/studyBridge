name: StudyBridge CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - LLM-clean
      - backend
      - frontend
      - fastapi
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
      - LLM-clean
      - backend
      - frontend
      - fastapi

jobs:
  branch-scope:
    name: Branch Scope Check
    runs-on: ubuntu-latest

    steps:
      - name: Android 전용 브랜치 PR 대상 확인
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$HEAD_REF" == android-* ]]; then
            echo "FAIL: $HEAD_REF 는 Android 앱 전용 브랜치입니다(fastapi/ops/scripts 미포함)."
            echo "$HEAD_REF → $BASE_REF 병합은 full-stack 서버 코드를 지우므로 이 파이프라인 대상이 아닙니다."
            echo "android-features → android-main 으로 PR 하세요. 검증은 StudyBridge Android CI 가 담당합니다."
            exit 1
          fi

          echo "PASS: full-stack 브랜치 (${HEAD_REF:-$GITHUB_REF_NAME})"

  detect:
    name: Detect Components
    runs-on: ubuntu-latest
    needs: branch-scope
    outputs:
      has_fastapi: ${{ steps.detect.outputs.has_fastapi }}
      has_guard_dashboard: ${{ steps.detect.outputs.has_guard_dashboard }}

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: 브랜치 구성 요소 감지
        id: detect
        run: |
          # 브랜치마다 포함 컴포넌트가 다르다(예: android 라인에는 fastapi/scripts 없음).
          # fastapi 는 '디렉터리 존재'로 판단한다. 디렉터리가 있으면 requirements.txt 유무와
          # 무관하게 fastapi-ci 를 실행해, requirements.txt 누락 시 skip 하지 않고 실패시킨다.
          if [ -d "fastapi" ]; then
            echo "has_fastapi=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_fastapi=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f "scripts/guard-dashboard.sh" ]; then
            echo "has_guard_dashboard=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_guard_dashboard=false" >> "$GITHUB_OUTPUT"
          fi

          echo "----- detected components -----"
          cat "$GITHUB_OUTPUT"

  backend-ci:
    name: Backend Spring Boot Gradle Build
    runs-on: ubuntu-latest
    needs: branch-scope

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Java 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: 백엔드 폴더 및 Gradle Wrapper 확인
        run: |
          if [ ! -d "backend" ]; then
            echo "backend 폴더가 없습니다."
            exit 1
          fi

          if [ ! -f "backend/gradlew" ]; then
            echo "backend/gradlew 파일이 없습니다."
            exit 1
          fi

          if [ ! -f "backend/build.gradle" ] && [ ! -f "backend/build.gradle.kts" ]; then
            echo "backend Gradle 빌드 파일이 없습니다."
            exit 1
          fi

      - name: Gradle Wrapper 실행 권한 부여
        run: chmod +x backend/gradlew

      - name: Java 버전 확인
        run: java -version

      - name: Spring Boot Gradle 빌드 및 단위 테스트
        run: |
          cd backend
          ./gradlew clean build

  frontend-ci:
    name: Frontend React Build
    runs-on: ubuntu-latest
    needs: branch-scope

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 프론트엔드 폴더 및 package.json 확인
        run: |
          if [ ! -d "frontend" ]; then
            echo "frontend 폴더가 없습니다."
            exit 1
          fi

          if [ ! -f "frontend/package.json" ]; then
            echo "frontend/package.json 파일이 없습니다."
            exit 1
          fi

      - name: Node 및 NPM 버전 확인
        run: |
          node -v
          npm -v

      - name: React 의존성 설치 및 빌드
        run: |
          cd frontend

          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

          npm run build

      - name: 빌드 가드 (vite dev 문자열 차단)
        run: |
          cd frontend
          test -f dist/index.html
          # 운영에는 정적 dist만 배포한다. dev 빌드 산출물이 섞이면 실패시킨다.
          if grep -nE "/@vite/client|react-refresh|/src/main\.jsx" dist/index.html; then
            echo "FAIL: dist/index.html에 vite dev 문자열 존재 — 정적 프로덕션 빌드가 아닙니다."
            exit 1
          fi
          echo "PASS: dist는 정적 프로덕션 빌드"

  fastapi-ci:
    name: FastAPI Python 3.12 Check
    runs-on: ubuntu-latest
    needs: [branch-scope, detect]
    # fastapi/requirements.txt 가 있는 브랜치(LLM-clean 등)에서만 실행한다.
    # android 라인(main/android-features)처럼 fastapi 가 없는 브랜치에서는 skip 되어
    # setup-python 의 cache:pip 가 의존성 파일을 못 찾는 실패가 발생하지 않는다.
    if: ${{ needs.detect.outputs.has_fastapi == 'true' }}

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      # setup-python(cache:pip) 보다 먼저 검사한다.
      # fastapi/ 가 있는데 requirements.txt 가 없으면 캐시 단계의 모호한 실패 대신
      # 여기서 명확히 실패시킨다(검사 누락 방지).
      - name: FastAPI 폴더 및 requirements.txt 확인
        run: |
          if [ ! -d "fastapi" ]; then
            echo "fastapi 폴더가 없습니다."
            exit 1
          fi

          if [ ! -f "fastapi/requirements.txt" ]; then
            echo "FAIL: fastapi/ 는 있으나 requirements.txt 가 없습니다. 의존성 파일을 추가하세요."
            exit 1
          fi

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fastapi/requirements.txt

      - name: Python 및 pip 버전 확인
        run: |
          python --version
          pip --version

      - name: FastAPI 라이브러리 설치
        run: |
          cd fastapi
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: FastAPI 문법 검사
        run: |
          cd fastapi
          python -m compileall .

  docker-ci:
    name: Dockerfile Build And Version Check
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - frontend-ci
      - fastapi-ci
      - detect
    # fastapi-ci 가 skip(해당 브랜치에 fastapi 없음)이어도 docker-ci 는 실행한다.
    # backend/frontend 가 성공했고 fastapi-ci 가 success 또는 skipped 일 때만 진행.
    if: ${{ always() && needs.backend-ci.result == 'success' && needs.frontend-ci.result == 'success' && (needs.fastapi-ci.result == 'success' || needs.fastapi-ci.result == 'skipped') }}

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker 버전 확인
        run: |
          docker --version

      - name: Backend Dockerfile 확인
        run: |
          if [ ! -f "backend/Dockerfile" ]; then
            echo "backend/Dockerfile 파일이 없습니다."
            exit 1
          fi

          echo "Backend Dockerfile FROM:"
          grep -i "^FROM" backend/Dockerfile

      - name: Frontend Dockerfile 확인
        run: |
          if [ ! -f "frontend/Dockerfile" ]; then
            echo "frontend/Dockerfile 파일이 없습니다."
            exit 1
          fi

          echo "Frontend Dockerfile FROM:"
          grep -i "^FROM" frontend/Dockerfile

      - name: FastAPI Dockerfile 확인
        if: ${{ needs.detect.outputs.has_fastapi == 'true' }}
        run: |
          if [ ! -f "fastapi/Dockerfile" ]; then
            echo "fastapi/Dockerfile 파일이 없습니다."
            exit 1
          fi

          echo "FastAPI Dockerfile FROM:"
          grep -i "^FROM" fastapi/Dockerfile

      - name: Backend Docker 이미지 빌드
        run: |
          docker build -t studybridge-backend:ci ./backend

      - name: Guard dashboard route
        if: ${{ needs.detect.outputs.has_guard_dashboard == 'true' }}
        run: bash scripts/guard-dashboard.sh

      - name: Frontend Docker 이미지 빌드
        run: |
          docker build -t studybridge-frontend:ci ./frontend

      - name: FastAPI Docker 이미지 빌드
        if: ${{ needs.detect.outputs.has_fastapi == 'true' }}
        run: |
          docker build -t studybridge-fastapi:ci ./fastapi

      - name: Backend Docker Java 버전 확인
        run: |
          docker run --rm --entrypoint sh studybridge-backend:ci -c "java -version"

      - name: Frontend Docker 런타임 버전 확인
        run: |
          docker run --rm --entrypoint sh studybridge-frontend:ci -c '
            if command -v nginx >/dev/null 2>&1; then
              nginx -v
            elif command -v node >/dev/null 2>&1; then
              node -v
            else
              echo "frontend 이미지 안에서 nginx 또는 node를 찾을 수 없습니다."
              exit 1
            fi
          '

      - name: FastAPI Docker Python 버전 확인
        if: ${{ needs.detect.outputs.has_fastapi == 'true' }}
        run: |
          docker run --rm --entrypoint sh studybridge-fastapi:ci -c "python --version && pip --version"

      - name: Docker 이미지 목록 확인
        run: |
          docker images | grep studybridge

  build-check:
    name: Final Build Check
    runs-on: ubuntu-latest
    needs:
      - branch-scope
      - detect
      - backend-ci
      - frontend-ci
      - fastapi-ci
      - docker-ci
    if: always()

    steps:
      - name: 전체 CI 결과 확인
        run: |
          echo "branch-scope result: ${{ needs.branch-scope.result }}"
          echo "detect result: ${{ needs.detect.result }} (has_fastapi=${{ needs.detect.outputs.has_fastapi }})"
          echo "backend-ci result: ${{ needs.backend-ci.result }}"
          echo "frontend-ci result: ${{ needs.frontend-ci.result }}"
          echo "fastapi-ci result: ${{ needs.fastapi-ci.result }}"
          echo "docker-ci result: ${{ needs.docker-ci.result }}"

          if [ "${{ needs.branch-scope.result }}" != "success" ]; then
            echo "branch-scope 실패: Android 전용 브랜치는 이 파이프라인 대상이 아닙니다"
            exit 1
          fi

          if [ "${{ needs.detect.result }}" != "success" ]; then
            echo "detect 실패"
            exit 1
          fi

          if [ "${{ needs.backend-ci.result }}" != "success" ]; then
            echo "backend-ci 실패"
            exit 1
          fi

          if [ "${{ needs.frontend-ci.result }}" != "success" ]; then
            echo "frontend-ci 실패"
            exit 1
          fi

          # fastapi-ci 는 fastapi 가 없는 브랜치에서 skip 되며, skip 은 정상으로 인정한다.
          if [ "${{ needs.fastapi-ci.result }}" = "skipped" ]; then
            echo "fastapi-ci 건너뜀: 이 브랜치에 fastapi/ 없음 (정상)"
          elif [ "${{ needs.fastapi-ci.result }}" != "success" ]; then
            echo "fastapi-ci 실패"
            exit 1
          fi

          if [ "${{ needs.docker-ci.result }}" != "success" ]; then
            echo "docker-ci 실패"
            exit 1
          fi

          echo "전체 CI 통과"
