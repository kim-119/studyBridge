name: StudyBridge CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - LLM-clean
      - backend
      - frontend
      - fastapi
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
      - LLM-clean
      - backend
      - frontend
      - fastapi

jobs:
  backend-ci:
    name: Backend Spring Boot Gradle Build
    runs-on: ubuntu-latest

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Java 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: 백엔드 폴더 및 Gradle Wrapper 확인
        run: |
          if [ ! -d "backend" ]; then
            echo "backend 폴더가 없습니다."
            exit 1
          fi

          if [ ! -f "backend/gradlew" ]; then
            echo "backend/gradlew 파일이 없습니다."
            exit 1
          fi

          if [ ! -f "backend/build.gradle" ] && [ ! -f "backend/build.gradle.kts" ]; then
            echo "backend Gradle 빌드 파일이 없습니다."
            exit 1
          fi

      - name: Gradle Wrapper 실행 권한 부여
        run: chmod +x backend/gradlew

      - name: Java 버전 확인
        run: java -version

      - name: Spring Boot Gradle 빌드 테스트 제외
        run: |
          cd backend
          ./gradlew clean build -x test

  frontend-ci:
    name: Frontend React Build
    runs-on: ubuntu-latest

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 프론트엔드 폴더 및 package.json 확인
        run: |
          if [ ! -d "frontend" ]; then
            echo "frontend 폴더가 없습니다."
            exit 1
          fi

          if [ ! -f "frontend/package.json" ]; then
            echo "frontend/package.json 파일이 없습니다."
            exit 1
          fi

      - name: Node 및 NPM 버전 확인
        run: |
          node -v
          npm -v

      - name: React 의존성 설치 및 빌드
        run: |
          cd frontend

          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

          npm run build

      - name: 빌드 가드 (vite dev 문자열 차단)
        run: |
          cd frontend
          test -f dist/index.html
          # 운영에는 정적 dist만 배포한다. dev 빌드 산출물이 섞이면 실패시킨다.
          if grep -nE "/@vite/client|react-refresh|/src/main\.jsx" dist/index.html; then
            echo "FAIL: dist/index.html에 vite dev 문자열 존재 — 정적 프로덕션 빌드가 아닙니다."
            exit 1
          fi
          echo "PASS: dist는 정적 프로덕션 빌드"

  fastapi-ci:
    name: FastAPI Python 3.12 Check
    runs-on: ubuntu-latest

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: FastAPI 폴더 및 requirements.txt 확인
        run: |
          if [ ! -d "fastapi" ]; then
            echo "fastapi 폴더가 없습니다."
            exit 1
          fi

          if [ ! -f "fastapi/requirements.txt" ]; then
            echo "fastapi/requirements.txt 파일이 없습니다."
            exit 1
          fi

      - name: Python 및 pip 버전 확인
        run: |
          python --version
          pip --version

      - name: FastAPI 라이브러리 설치
        run: |
          cd fastapi
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: FastAPI 문법 검사
        run: |
          cd fastapi
          python -m compileall .

  docker-ci:
    name: Dockerfile Build And Version Check
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - frontend-ci
      - fastapi-ci

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker 버전 확인
        run: |
          docker --version

      - name: Backend Dockerfile 확인
        run: |
          if [ ! -f "backend/Dockerfile" ]; then
            echo "backend/Dockerfile 파일이 없습니다."
            exit 1
          fi

          echo "Backend Dockerfile FROM:"
          grep -i "^FROM" backend/Dockerfile

      - name: Frontend Dockerfile 확인
        run: |
          if [ ! -f "frontend/Dockerfile" ]; then
            echo "frontend/Dockerfile 파일이 없습니다."
            exit 1
          fi

          echo "Frontend Dockerfile FROM:"
          grep -i "^FROM" frontend/Dockerfile

      - name: FastAPI Dockerfile 확인
        run: |
          if [ ! -f "fastapi/Dockerfile" ]; then
            echo "fastapi/Dockerfile 파일이 없습니다."
            exit 1
          fi

          echo "FastAPI Dockerfile FROM:"
          grep -i "^FROM" fastapi/Dockerfile

      - name: Backend Docker 이미지 빌드
        run: |
          docker build -t studybridge-backend:ci ./backend

      - name: Guard dashboard route
        run: bash scripts/guard-dashboard.sh

      - name: Frontend Docker 이미지 빌드
        run: |
          docker build -t studybridge-frontend:ci ./frontend

      - name: FastAPI Docker 이미지 빌드
        run: |
          docker build -t studybridge-fastapi:ci ./fastapi

      - name: Backend Docker Java 버전 확인
        run: |
          docker run --rm --entrypoint sh studybridge-backend:ci -c "java -version"

      - name: Frontend Docker 런타임 버전 확인
        run: |
          docker run --rm --entrypoint sh studybridge-frontend:ci -c '
            if command -v nginx >/dev/null 2>&1; then
              nginx -v
            elif command -v node >/dev/null 2>&1; then
              node -v
            else
              echo "frontend 이미지 안에서 nginx 또는 node를 찾을 수 없습니다."
              exit 1
            fi
          '

      - name: FastAPI Docker Python 버전 확인
        run: |
          docker run --rm --entrypoint sh studybridge-fastapi:ci -c "python --version && pip --version"

      - name: Docker 이미지 목록 확인
        run: |
          docker images | grep studybridge

  build-check:
    name: Final Build Check
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - frontend-ci
      - fastapi-ci
      - docker-ci
    if: always()

    steps:
      - name: 전체 CI 결과 확인
        run: |
          echo "backend-ci result: ${{ needs.backend-ci.result }}"
          echo "frontend-ci result: ${{ needs.frontend-ci.result }}"
          echo "fastapi-ci result: ${{ needs.fastapi-ci.result }}"
          echo "docker-ci result: ${{ needs.docker-ci.result }}"

          if [ "${{ needs.backend-ci.result }}" != "success" ]; then
            echo "backend-ci 실패"
            exit 1
          fi

          if [ "${{ needs.frontend-ci.result }}" != "success" ]; then
            echo "frontend-ci 실패"
            exit 1
          fi

          if [ "${{ needs.fastapi-ci.result }}" != "success" ]; then
            echo "fastapi-ci 실패"
            exit 1
          fi

          if [ "${{ needs.docker-ci.result }}" != "success" ]; then
            echo "docker-ci 실패"
            exit 1
          fi

          echo "전체 CI 통과"

  # feature/learning-loop-ec2: backend-ci 는 '-x test' 라 테스트가 CI 에서 돌지 않았다. 품질 게이트·3계약·학습 후보 outbox 회귀를
  #  실제로 실행한다. PG/Redis 통합 테스트는 이 job 의 일회용 서비스 컨테이너만 사용한다(운영 DB/Redis 접속 없음).
  #  기존 build-check 게이트는 바꾸지 않는다(독립 보고). ai07 PR #116 의 fastapi-tests job 과 별개.
  backend-tests:
    name: Backend Gradle test (unit + contract + PG/Redis integration)
    runs-on: ubuntu-latest
    services:
      pgtest:
        image: postgres:16
        env:
          POSTGRES_USER: sbtest
          POSTGRES_PASSWORD: sbtest
          POSTGRES_DB: sbtest
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U sbtest" --health-interval 5s --health-timeout 5s --health-retries 10
      redistest:
        image: redis:7-alpine
        ports:
          - 16379:6379
    env:
      SB_TEST_PG_URL: jdbc:postgresql://127.0.0.1:55432/sbtest
      SB_TEST_PG_USER: sbtest
      SB_TEST_PG_PASSWORD: sbtest
      SB_TEST_REDIS_PORT: "16379"
      # 실제 전송 요청(학습 샘플·철회·삭제·피드백)을 남겨 ai07 Python 검증기로 판정한다(테스트 전용 키, 운영 키 아님).
      SB_TRAINING_XLANG_OUT: ${{ github.workspace }}/backend/build/training-requests.json
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Gradle test
        run: |
          chmod +x backend/gradlew
          cd backend
          ./gradlew test --no-daemon --continue

      - name: 테스트 결과 요약
        if: always()
        run: |
          cd backend
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for p in glob.glob('build/test-results/test/*.xml'):
              r = ET.parse(p).getroot()
              t += int(r.get('tests')); f += int(r.get('failures')); e += int(r.get('errors')); s += int(r.get('skipped'))
              for tc in r.findall('testcase'):
                  if tc.find('failure') is not None or tc.find('error') is not None:
                      print('FAIL', r.get('name'), tc.get('name'))
          print(f'tests={t} failures={f} errors={e} skipped={s}')
          PY

      - name: ai07 교차 검증(계약 fixture 30 + 실제 학습 요청 서명·계약)
        # ai07 코드: 같은 트리(fastapi/app/contracts — 두 PR 병합 후)가 있으면 그것을, 없으면 ai07 PR 브랜치에서 읽기 전용 추출.
        # 둘 다 없으면 SKIP 으로 표시한다(PASS 로 보이지 않게).
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/ai07"; mkdir -p "$A"
          if [ -f fastapi/app/training_pipeline/control.py ] && [ -f fastapi/app/contracts/jtypes.py ]; then
            cp -r fastapi/app "$A/app"; echo "ai07 source: working tree"
          elif git fetch --no-tags --depth=1 origin feature/learning-loop-ai07 2>/dev/null; then
            git archive FETCH_HEAD fastapi/app/contracts fastapi/app/training_pipeline/control.py | tar -x -C "$A" --strip-components=1
            echo "ai07 source: feature/learning-loop-ai07 @ $(git rev-parse --short FETCH_HEAD)"
          else
            echo "::warning::ai07 소스 없음 — 교차 검증 SKIP"; exit 0
          fi
          touch "$A/app/__init__.py" "$A/app/training_pipeline/__init__.py"
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q "pydantic==2.13.4"
          cd backend/src/test/resources/ai-contracts/v1
          "$RUNNER_TEMP/venv/bin/python" -I tools/crosscheck_pydantic.py "$A" .
          if [ -f "$SB_TRAINING_XLANG_OUT" ]; then
            "$RUNNER_TEMP/venv/bin/python" -I tools/verify_training_requests_ai07.py "$A" "$SB_TRAINING_XLANG_OUT"
          else
            echo "::error::학습 요청 산출물 없음(TrainingPipelinePostgresTest 미실행)"; exit 1
          fi

  frontend-smoke:
    name: Frontend smoke (AI 품질 표시 경계)
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ai-quality-display smoke
        run: |
          cd frontend
          node src/__tests__/ai-quality-display.smoke.mjs
