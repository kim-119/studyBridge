name: StudyBridge CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - fix/main-baseline-clean

jobs:
  backend-build:
    name: Backend Spring Boot Gradle Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check backend Dockerfile exists
        run: test -f backend/Dockerfile

  fastapi-check:
    name: FastAPI Python 3.12 Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check FastAPI Dockerfile exists
        run: test -f fastapi/Dockerfile

  frontend-build:
    name: Frontend React Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check frontend Dockerfile exists
        run: test -f frontend/Dockerfile

  dockerfile-check:
    name: Dockerfile Build And Version Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check ci file exists
        run: test -f .github/workflows/ci.yml
      - name: Check gitignore exists
        run: test -f .gitignore
      - name: Check docker compose exists
        run: test -f docker-compose.yml
      - name: Check backend Dockerfile exists
        run: test -f backend/Dockerfile
      - name: Check fastapi Dockerfile exists
        run: test -f fastapi/Dockerfile
      - name: Check frontend Dockerfile exists
        run: test -f frontend/Dockerfile

  final-build-check:
    name: Final Build Check
    runs-on: ubuntu-latest
    needs:
      - backend-build
      - fastapi-check
      - frontend-build
      - dockerfile-check
    steps:
      - name: Final success check
        run: echo "Main baseline check completed successfully"

  build-check:
    name: build-check
    runs-on: ubuntu-latest
    needs:
      - final-build-check
    steps:
      - name: Required build-check passed
        run: echo "build-check passed"