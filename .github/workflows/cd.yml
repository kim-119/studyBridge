name: StudyBridge CD Pipeline

on:
  push:
    branches: [ develop ]

jobs:
  build-and-deploy:
    name: Build and Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Backend (Spring Boot) 이미지 빌드 및 푸시
      - name: Backend 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/studybridge-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/studybridge-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend (React) 이미지 빌드 및 푸시
      - name: Frontend 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/studybridge-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/studybridge-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # AI (FastAPI) 이미지 빌드 및 푸시
      - name: FastAPI 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./fastapi
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/studybridge-fastapi:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/studybridge-fastapi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # AWS EC2 배포
      - name: AWS EC2 서버 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/studyBridge
            
            # 최신 docker-compose.yml 반영
            git pull origin develop
            
            # Docker Hub 로그인 및 최신 이미지 Pull
            echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
            docker-compose pull
            
            # 서비스 무중단 재시작
            docker-compose up -d --remove-orphans
            
            # 사용하지 않는 이미지 정리
            docker image prune -f
