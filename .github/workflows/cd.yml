name: StudyBridge CD Pipeline

# CI("StudyBridge CI Pipeline") 성공 후에만 CD가 실행된다.
# LLM-clean push로 인한 직접 배포 트리거는 제거하고 workflow_run 기반으로만 동작한다.
on:
  workflow_dispatch:
  push:
    branches:
      - LLM-clean
  workflow_run:
    workflows: ["StudyBridge CI Pipeline"]
    branches: [ LLM-clean ]
    types:
      - completed

jobs:
  build-and-deploy:
    name: Build and Deploy to AWS EC2
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    # CI가 LLM-clean에서 success로 끝난 경우에만 배포한다. 그 외에는 배포하지 않는다.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'LLM-clean') }}

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4
        with:
          # CI가 검증한 정확한 commit을 빌드/배포한다.
          ref: ${{ env.DEPLOY_SHA }}

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Backend 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/studybridge-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/studybridge-backend:${{ env.DEPLOY_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/studybridge-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/studybridge-frontend:${{ env.DEPLOY_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # FastAPI 운영 배포는 현재 DockerHub image가 아니라
      # EC2 compose의 fastapi-tunnel-proxy(alpine/socat)를 통해 ai07 FastAPI로 연결된다.
      # 운영 compose에는 studybridge-fastapi image가 존재하지 않으므로
      # studybridge-fastapi image build/push는 현재 CD 배포 대상이 아니어서 비활성화한다.
      # (FastAPI 코드 검증은 ci.yml의 fastapi-ci에서 계속 수행된다.)
      # - name: FastAPI 빌드 및 푸시
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: ./fastapi
      #     push: true
      #     tags: |
      #       ${{ secrets.DOCKERHUB_USERNAME }}/studybridge-fastapi:latest
      #       ${{ secrets.DOCKERHUB_USERNAME }}/studybridge-fastapi:${{ env.DEPLOY_SHA }}
      #     cache-from: type=gha
      #     cache-to: type=gha,mode=max

      - name: AWS EC2 서버 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            APP_DIR="/home/ubuntu/studyBridge"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "studyBridge repo not found: $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"

            sudo systemctl stop studybridge-healthcheck.timer || true
            sudo systemctl stop studybridge-auto-deploy.timer || true
            sudo systemctl stop studybridge-healthcheck.service || true
            sudo systemctl stop studybridge-auto-deploy.service || true

            sudo chown -R "$USER:$USER" "$APP_DIR"

            # CI가 검증한 정확한 SHA로만 동기화한다. develop/main/다른 SHA로 fallback 금지.
            git fetch origin LLM-clean
            git switch LLM-clean
            git reset --hard "${{ env.DEPLOY_SHA }}"

            # 운영 파일(.env, override, db init, node_modules)은 보호한다. -fdx 금지.
            git clean -fd \
              -e .env \
              -e ".env.*" \
              -e docker-compose.override.yml \
              -e node_modules \
              -e "fastapi/db/init"

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # 운영 compose service name은 react(frontend), spring(backend)이다.
            # DockerHub에서 pull한 image를 사용하고, 운영에서 실수로 빌드되지 않도록 --no-build를 강제한다.
            docker compose pull react spring
            docker compose up -d --no-build --force-recreate --remove-orphans

            docker image prune -f

            sudo systemctl start studybridge-auto-deploy.timer || true
            sudo systemctl start studybridge-healthcheck.timer || true

            docker compose ps
