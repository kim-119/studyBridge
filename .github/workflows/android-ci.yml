name: StudyBridge Android CI

on:
  push:
    branches:
      - android-features
      - android-main
    paths:
      - "frontend/**"
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches:
      - android-features
      - android-main
    paths:
      - "frontend/**"
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-ci.yml"

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MOBILE_API_BASE_URL: https://studybridge.co.kr

jobs:
  android-debug-build:
    name: Mobile bundle and debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Capacitor 의존성 설치
        run: npm ci

      - name: 프론트엔드 의존성 설치
        run: npm --prefix frontend ci

      - name: 모바일 레이어 정적 검사
        run: npm --prefix frontend run lint:mobile

      - name: 데스크톱 번들 회귀 확인
        run: |
          npm run build
          test -f frontend/dist/index.html

      - name: 모바일 번들 빌드
        env:
          VITE_API_BASE_URL: ${{ env.MOBILE_API_BASE_URL }}
        run: |
          npm run build:mobile
          test -f frontend/dist-mobile/index.html

      - name: 모바일 번들 가드
        run: |
          BUNDLE=$(ls frontend/dist-mobile/assets/index-*.js)
          echo "검사 대상: $BUNDLE"

          if ! grep -q "${MOBILE_API_BASE_URL}" "$BUNDLE"; then
            echo "FAIL: 모바일 번들에 절대 API base URL이 없습니다. WebView에서 모든 요청이 실패합니다."
            exit 1
          fi

          for desktop_only in openvidu fullcalendar sockjs; do
            if grep -q "$desktop_only" "$BUNDLE"; then
              echo "FAIL: 모바일 번들에 데스크톱 전용 의존성($desktop_only)이 포함됐습니다."
              exit 1
            fi
          done

          echo "PASS: 모바일 번들은 절대 API base URL을 쓰고 데스크톱 의존성을 포함하지 않습니다."

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: Capacitor Android 동기화
        run: npx cap sync android

      - name: Gradle Wrapper 실행 권한 부여
        run: chmod +x android/gradlew

      - name: Android 단위 테스트
        run: |
          cd android
          ./gradlew testDebugUnitTest

      - name: Debug APK 빌드
        run: |
          cd android
          ./gradlew assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Debug APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: studybridge-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
