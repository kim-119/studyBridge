name: StudyBridge Android CI

on:
  push:
    branches:
      - android-features
      - android-main
    paths:
      - "frontend/**"
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-ci.yml"
      - ".github/scripts/mobile-bundle-guard.sh"
      - ".github/scripts/verify-screenshare-apk.sh"
  pull_request:
    branches:
      - android-features
      - android-main
    paths:
      - "frontend/**"
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-ci.yml"
      - ".github/scripts/mobile-bundle-guard.sh"
      - ".github/scripts/verify-screenshare-apk.sh"

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MOBILE_API_BASE_URL: https://studybridge.co.kr

jobs:
  android-debug-build:
    name: Mobile bundle and debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 22 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Capacitor 의존성 설치
        run: npm ci

      - name: 프론트엔드 의존성 설치
        run: npm --prefix frontend ci

      - name: 모바일 레이어 정적 검사
        run: npm --prefix frontend run lint:mobile

      - name: 모바일 단위 테스트
        run: npm --prefix frontend run test:mobile

      - name: 데스크톱 번들 회귀 확인
        run: |
          npm run build
          test -f frontend/dist/index.html

      - name: 모바일 번들 빌드
        env:
          VITE_API_BASE_URL: ${{ env.MOBILE_API_BASE_URL }}
          # PDF별 퀴즈 랭킹(서버 GET /api/materials/{id}/quiz/{quizId}/ranking 운영 배포됨)
          VITE_FEATURE_MATERIAL_RANKING: "true"
        run: |
          npm run build:mobile
          test -f frontend/dist-mobile/index.html

      - name: 모바일 번들 가드
        run: bash .github/scripts/mobile-bundle-guard.sh

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: Capacitor Android 동기화
        run: npx cap sync android

      - name: Gradle Wrapper 실행 권한 부여
        run: chmod +x android/gradlew

      - name: Android 단위 테스트
        run: |
          cd android
          ./gradlew testDebugUnitTest

      - name: Android 정적 검사
        run: |
          cd android
          ./gradlew lintDebug

      - name: Debug APK 빌드
        run: |
          cd android
          ./gradlew assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Debug APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: studybridge-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # v1.6: 네이티브 전체 화면공유가 APK 에 실제로 들어갔는지(라이브러리·서비스·권한·클래스) 확인한다.
      - name: Debug APK 화면공유 포함 검증
        run: bash .github/scripts/verify-screenshare-apk.sh android/app/build/outputs/apk/debug/app-debug.apk
