services:
  # 운영 프론트는 nginx가 /var/www/studybridge/current 정적 dist를 직접 서빙한다.
  # react(vite dev server) 컨테이너는 운영에서 사용하지 않는다.
  # profiles:["dev"]를 부여해 기본 `docker compose up -d`(프로필 미지정)에서는
  # 절대 기동되지 않는다. 로컬 개발 시에만 `docker compose --profile dev up -d react`로 띄운다.
  react:
    image: ${DOCKER_IMAGE_PREFIX:-studybridge}-frontend:latest
    build:
      context: ./frontend
    container_name: capstone-react
    profiles:
      - dev
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - spring
    restart: unless-stopped

  spring:
    image: ${DOCKER_IMAGE_PREFIX:-studybridge}-backend:latest
    container_name: capstone-spring
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-capstone}
      DB_USER: ${DB_USER:-capstone}
      DB_PASSWORD: ${DB_PASSWORD:-1234}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}

      FASTAPI_BASE_URL: http://host.docker.internal:18000
      AI_SERVER_API_KEY: ${AI_SERVER_API_KEY:-}
      FASTAPI_EXTRACTION_URL: http://host.docker.internal:18000/api/extract
      FASTAPI_TIMEOUT: ${FASTAPI_TIMEOUT:-180000}
      # 자료보관함 키워드 정의 / 플래너 AI 확장 / 플래너 12주 로드맵 호출 타임아웃(초). 하드코딩 금지.
      AI_KEYWORD_DEFINE_TIMEOUT_SECONDS: ${AI_KEYWORD_DEFINE_TIMEOUT_SECONDS:-60}
      AI_PLANNER_EXPAND_TIMEOUT_SECONDS: ${AI_PLANNER_EXPAND_TIMEOUT_SECONDS:-120}
      AI_ROADMAP_TIMEOUT_SECONDS: ${AI_ROADMAP_TIMEOUT_SECONDS:-180}

      OPENVIDU_URL: http://openvidu:4443
      OPENVIDU_SECRET: ${OPENVIDU_SECRET:-MY_SECRET}

      # 메인 배너 헤드라인(1행). 재빌드 없이 운영 이미지에 런타임 주입(application.yml 기본값과 동기화).
      BANNER_MAIN_TITLE: ${BANNER_MAIN_TITLE:-학습의 흐름을 하나로 잇다}
      # 메인 배너 MCP 식별자 (서버 전용, 프론트 노출 금지)
      BANNER_MCP_TOKEN: ${BANNER_MCP_TOKEN:-}
      TZ: Asia/Seoul

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - db
      - redis
      - openvidu

    restart: unless-stopped

  openvidu:
    image: openvidu/openvidu-dev:2.30.0
    container_name: capstone-openvidu
    # 외부에는 직접 노출하지 않고 호스트 Nginx(정식 Let's Encrypt 인증서)가 4443을 종단한다.
    #  - openvidu-dev 이미지는 owncert를 지원하지 않고 내부 self-signed 인증서만 쓴다.
    #  - 따라서 브라우저는 wss://www.studybridge.co.kr:4443 (Nginx, 정식 인증서)로 붙고,
    #    Nginx가 내부 self-signed openvidu(127.0.0.1:14443)로 프록시한다.
    ports:
      - "127.0.0.1:14443:4443"
    environment:
      OPENVIDU_SECRET: ${OPENVIDU_SECRET:-MY_SECRET}
      DOMAIN_OR_PUBLIC_IP: ${OPENVIDU_DOMAIN_OR_PUBLIC_IP:-localhost}
      OPENVIDU_PUBLICURL: ${OPENVIDU_PUBLICURL:-https://www.studybridge.co.kr:4443}
      CERTIFICATE_TYPE: selfsigned
      OPENVIDU_WEBHOOK: "false"
      TZ: Asia/Seoul
    restart: on-failure

  db:
    image: postgres:16
    container_name: capstone-db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-capstone}
      POSTGRES_USER: ${POSTGRES_USER:-capstone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: capstone-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    environment:
      TZ: Asia/Seoul
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

