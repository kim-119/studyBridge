services:
  react:
    image: ${DOCKER_IMAGE_PREFIX:-studybridge}-frontend:latest
    build:
      context: ./frontend
    container_name: capstone-react
    ports:
      - "80:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - spring

  spring:
    image: ${DOCKER_IMAGE_PREFIX:-studybridge}-backend:latest
    container_name: capstone-spring
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-capstone}
      DB_USER: ${DB_USER:-capstone}
      DB_PASSWORD: ${DB_PASSWORD:-1234}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      FASTAPI_BASE_URL: http://fastapi:8000
      FASTAPI_EXTRACTION_URL: http://fastapi:8000/api/extract
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

    depends_on:
      - db
      - fastapi

  fastapi:
    image: ${DOCKER_IMAGE_PREFIX:-studybridge}-fastapi:latest
    build:
      context: ./fastapi
    container_name: capstone-fastapi
    ports:
      - "8000:8000"
    volumes:
      - ./fastapi:/app
    env_file:
      - ./fastapi/.env
    environment:
      PYTHONUNBUFFERED: 1
      TZ: Asia/Seoul
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-capstone}
      DB_USER: ${DB_USER:-capstone}
      DB_PASSWORD: ${DB_PASSWORD:-1234}
      AI_DATABASE_URL: postgresql://${DB_USER:-capstone}:${DB_PASSWORD:-1234}@${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-capstone}
      VECTOR_DATABASE_URL: postgresql://${DB_USER:-capstone}:${DB_PASSWORD:-1234}@${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-capstone}
      DATABASE_URL: postgresql://${DB_USER:-capstone}:${DB_PASSWORD:-1234}@${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-capstone}
      AI_DB_SCHEMA: ${AI_DB_SCHEMA:-ai}
      RAG_DB_SCHEMA: ${RAG_DB_SCHEMA:-rag}
      REDIS_URL: redis://redis:6379/0
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16
    container_name: capstone-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: capstone
      POSTGRES_USER: capstone
      POSTGRES_PASSWORD: 1234
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: capstone-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      - TZ=Asia/Seoul

volumes:
  postgres_data:
  redis_data:
