# ============================================================
# StudyBridge Spring Boot → FastAPI AI 서버 연동 설정 예시
# 이 내용을 기존 application.yml (또는 application-prod.yml)에 병합하세요.
# ============================================================

ai:
  server:
    # FastAPI 서버 주소 (같은 서버면 localhost, 별도 서버면 IP/도메인)
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8000}
    # FastAPI의 AI_SERVER_API_KEY와 반드시 동일해야 함
    api-key: ${AI_SERVER_API_KEY:studybridge-internal-secret}
    # 연결 타임아웃 (ms) — 임베딩 모델 로드 지연 고려해 충분히 설정
    connect-timeout-ms: ${AI_SERVER_CONNECT_TIMEOUT_MS:5000}
    # 읽기 타임아웃 (ms) — Qwen2.5 응답 생성 시간 고려 (60초 권장)
    read-timeout-ms: ${AI_SERVER_READ_TIMEOUT_MS:60000}

# ============================================================
# 환경변수 (.env 또는 OS 환경변수로 주입)
# ============================================================
# AI_SERVER_BASE_URL=http://ai-server-ip:8000
# AI_SERVER_API_KEY=studybridge-internal-secret
# AI_SERVER_CONNECT_TIMEOUT_MS=5000
# AI_SERVER_READ_TIMEOUT_MS=60000
