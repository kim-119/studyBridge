# StudyBridge QLoRA Optional Config
# 목적: Qwen2.5 14B 기반 스타일 adapter smoke/pilot 실험
# 위치: 주력이 아닌 보조 실험. 전체 전략의 향미제 수준.
# 실행: 서버컴에서 bitsandbytes/CUDA 호환 확인 후 실행.
# 실패해도 Qwen2.5 14B Ollama 추론 + prompt/controller 구조로 간다.
#
# 이 config로 학습하는 것: StudyBridge 성격/지식수준/티키타카 응답 패턴
# 이 config로 학습하지 않는 것: PDF 전공지식, 최신정보, 사용자 개인정보
# ──────────────────────────────────────────────────────────────────────────

model:
  # 서버컴에서 실제 Qwen2.5 14B 모델 경로로 교체할 것
  # Hugging Face model ID 또는 로컬 경로
  model_name_or_path: "Qwen/Qwen2.5-14B-Instruct"
  # 로컬 경로 예시:
  # model_name_or_path: "/models/Qwen2.5-14B-Instruct"

quantization:
  # 4-bit QLoRA: base model을 4bit로 양자화한 뒤 LoRA adapter 학습
  # 양자화는 base model 메모리 절감용. LoRA adapter는 full precision으로 학습.
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

lora:
  # LoRA adapter 설정
  # r: adapter rank. 작을수록 파라미터 적음. 8~16 권장.
  r: 16
  # alpha: LoRA 스케일링 계수. r의 1~2배 권장.
  lora_alpha: 32
  # dropout: 과적합 방지
  lora_dropout: 0.05
  # 학습할 모듈. Qwen2.5는 q_proj, v_proj 기본. k_proj, o_proj 추가 가능.
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  # 데이터셋 경로 (SFT 형식 JSONL)
  dataset_path: "./data/sft_train.jsonl"
  eval_dataset_path: "./data/sft_eval.jsonl"

  # smoke test: 소량 데이터로 파이프라인 동작 확인
  # pilot: 실제 학습 전 소규모 실험
  # full: 전체 데이터 학습 (서버컴 준비 완료 후)
  mode: "smoke"  # smoke | pilot | full

  # 최대 시퀀스 길이. 늘릴수록 메모리 증가.
  max_seq_length: 1024

  # batch size. 14B + 4bit QLoRA + 16GB VRAM에서 1이 안전.
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1

  # gradient accumulation으로 effective batch size 보완
  gradient_accumulation_steps: 16

  # epochs. smoke/pilot은 1로 충분. full은 2~3.
  num_train_epochs: 1

  # 학습률
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05

  # 저장/로깅
  output_dir: "./adapters/qwen25_14b_studybridge"
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  save_total_limit: 2

  # 기타
  fp16: false       # bfloat16 사용 권장
  bf16: true
  gradient_checkpointing: true   # 메모리 절감 (속도 약간 저하)
  dataloader_num_workers: 0      # Windows 호환성

  # 데이터 콜레이터
  data_collator: "DataCollatorForSeq2Seq"

output:
  adapter_name: "studybridge-qwen25-14b-style"
  # 학습 완료 후 Ollama에 로드하는 방법:
  # 1. adapter를 merged model로 내보내기
  # 2. GGUF 변환 후 ollama create로 등록
  # 3. 또는 PEFT adapter를 FastAPI에서 직접 로드 (서버컴 메모리 확인 필요)
