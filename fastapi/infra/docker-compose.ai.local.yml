# ============================================================
# StudyBridge AI 전용 인프라 — 로컬/개발 환경
# ============================================================
# 목적:
#   기존 docker-compose.yml의 capstone-db(5432)와 충돌 없이
#   AI 서버 전용 pgvector DB와 Redis를 독립적으로 실행한다.
#
# 실행 방법 (AI 인프라만):
#   docker compose -f fastapi/infra/docker-compose.ai.local.yml up -d
#
# 전체 스택과 함께 실행 (루트 compose + AI 인프라 병합):
#   docker compose \
#     -f docker-compose.yml \
#     -f fastapi/infra/docker-compose.ai.local.yml \
#     up -d
#
# 컨테이너 내부 접근:
#   FastAPI → ai-db:   postgresql://studybridge_ai:studybridge_ai_pw@capstone-ai-db:5432/studybridge_ai
#   FastAPI → redis:   redis://capstone-redis:6379/0
#
# 호스트(로컬) 직접 접근:
#   psql postgresql://studybridge_ai:studybridge_ai_pw@localhost:5433/studybridge_ai
#   redis-cli -p 6380
# ============================================================

services:
  ai-db:
    image: pgvector/pgvector:pg16
    container_name: capstone-ai-db
    ports:
      - "5433:5432"               # 호스트 5433 → 컨테이너 5432 (capstone-db 5432와 충돌 없음)
    environment:
      POSTGRES_DB: studybridge_ai
      POSTGRES_USER: studybridge_ai
      POSTGRES_PASSWORD: studybridge_ai_pw
      TZ: Asia/Seoul
    volumes:
      - ai_postgres_data:/var/lib/postgresql/data
      # 컨테이너 최초 기동 시 init SQL 자동 실행 (ai-db 전용)
      - ../app/db/migrations:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studybridge_ai -d studybridge_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: capstone-redis
    ports:
      - "6380:6379"               # 호스트 6380 → 컨테이너 6379
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  ai_postgres_data:
    name: capstone_ai_postgres_data
  redis_data:
    name: capstone_redis_data
