# 분류 가능한 도메인 목록
domains:
  - computer_science
  - mathematics
  - physics
  - chemistry
  - biology
  - medicine_health
  - psychology
  - philosophy
  - economics
  - business
  - law
  - education
  - sociology
  - history
  - literature
  - linguistics
  - art_design
  - engineering
  - environment
  - general_study
  - unknown


