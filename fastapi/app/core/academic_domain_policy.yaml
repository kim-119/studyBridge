# ── 분류 정책 ────────────────────────────────────────────
classification:
  rule_based_threshold: 0.40        # 이 이상이면 규칙 기반 결과 사용
  llm_fallback_threshold: 0.40      # 이 미만이면 LLM fallback 사용
  unknown_threshold: 0.25           # 이 미만이면 general_study로 처리
  high_stakes_domains:
    - "medicine_health"
    - "law"
  high_stakes_disclaimer: "이 답변은 교육적 목적으로만 제공됩니다. 전문가 상담을 권장합니다."
