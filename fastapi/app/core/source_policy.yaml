# ============================================================
# 소스 라우팅 정책
# academic_source_router.py가 이 파일을 참조한다.
# ============================================================

sources:
  rag:
    enabled: true
    priority: 1

  wikipedia:
    enabled: true
    priority: 3

  tavily:
    enabled: true
    priority: 4

  openalex:
    enabled_env: OPENALEX_ENABLED
    api_key_env: OPENALEX_API_KEY
    base_url_env: OPENALEX_BASE_URL
    only_for_knowledge_level: "박사"
    min_publication_date_env: OPENALEX_MIN_PUBLICATION_DATE
    min_publication_date_default: "2020-01-01"
    expose_to_user_default: false
    per_page_env: OPENALEX_PER_PAGE
    per_page_default: 3
    sort_env: OPENALEX_SORT
    sort_default: "cited_by_count:desc"
    timeout_env: OPENALEX_TIMEOUT_SECONDS
    timeout_default: 8


# ── 도메인별 소스 라우팅 ──────────────────────────────────
domain_source_routing:
