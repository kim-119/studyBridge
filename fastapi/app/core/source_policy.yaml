# ── source leakage 금지 표현 ──────────────────────────────
leakage_guard:
  forbidden_phrases:
    - "OpenAlex"
    - "논문에서 발췌"
    - "2020년 이후 논문"
    - "최근 논문에 따르면"
    - "인용 수"
    - "DOI:"
    - "doi.org"
    - "학술 문헌에 따르면"
    - "발표된 연구에 따르면"
    - "피인용 횟수"
    - "arXiv"
  max_rewrite_attempts: 1
