# ============================================================
# 전 학문 도메인별 박사 수준 depth profile
# domain_classifier 결과에 따라 depth verifier가 이 파일을 참조한다.
# ============================================================

# 공통 academic rubric (domain profile이 없는 경우 사용)
default_academic_rubric:
  depth_axes:
    - "개념 정의"
    - "이론적 배경"
    - "방법론"
    - "한계"
    - "적용"
  doctoral_expectations:
    - "엄밀한 개념 구분"
    - "이론적 배경 및 근거"
    - "방법론적 한계"
    - "반례 또는 예외 가능성"
    - "논쟁점 또는 대안 관점"
  min_depth_coverage: 0.65

domains:
  mathematics:
    depth_axes:
      - "정의"
      - "정리 또는 명제"
      - "증명 아이디어"
      - "예제"
      - "반례"
      - "응용"
    doctoral_expectations:
      - "엄밀한 정의"
      - "필요조건/충분조건 구분"
      - "증명 전략"
      - "일반화 가능성"
      - "반례 또는 경계 조건"
