# StudyBridge AI 전용 Docker Compose
# 기존 Spring Boot / MySQL 구성과 독립적으로 동작한다.
# pgvector-db 포트를 5433으로 매핑하여 기존 DB(5432)와 충돌을 방지한다.
#
# 실행 방법:
#   docker compose -f docker-compose.ai.yml up -d
#
# 컨테이너 내부 FastAPI → pgvector 접속 주소:
#   postgresql://studybridge:<password>@pgvector-db:5432/studybridge_ai
# 호스트(로컬) → pgvector 접속 주소:
#   postgresql://studybridge:<password>@localhost:5433/studybridge_ai

services:
  pgvector-db:
    image: pgvector/pgvector:pg16
    container_name: studybridge-pgvector
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: studybridge_ai
      POSTGRES_USER: studybridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studybridge -d studybridge_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
