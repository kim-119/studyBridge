apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def signingPropertiesFile = rootProject.file('key.properties')
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def screenShareEnabled = (project.findProperty('sbScreenShare') ?: 'false').toString() == 'true'

android {
    namespace = "kr.co.studybridge.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "kr.co.studybridge.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 버전은 CI(릴리스 파이프라인)가 공개 /api/app/version 기준으로 계산해 -PsbVersionCode/-PsbVersionName 으로 전달한다.
        // 전달이 없으면(로컬 개발 빌드) 기존 기본값 1 / "1.0" 을 쓴다. Git 에는 버전을 자동 커밋하지 않는다.
        versionCode project.hasProperty('sbVersionCode') ? project.property('sbVersionCode').toString().toInteger() : 1
        versionName project.hasProperty('sbVersionName') ? project.property('sbVersionName').toString() : "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "boolean", "SCREEN_SHARE_ENABLED", screenShareEnabled.toString()
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signingPropertiesFile.exists()) {
                storeFile rootProject.file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }
    buildFeatures {
        buildConfig = true
    }
    lint {
        // PropertyEscape 는 local.properties 만 건드린다. 이 파일은 gitignore 대상이라
        // CI 에는 존재하지 않고, 개발자 로컬 경로 때문에 빌드가 실패하는 것을 막는다.
        disable += 'PropertyEscape'
        abortOnError true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    buildTypes {
        release {
            if (signingPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit:$kotlinVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // 네이티브 화면공유(MediaProjection + libwebrtc). 실기기 검증 전에는 기본 빌드(v1.5 릴리스)에 넣지 않는다.
    // 포함: ./gradlew assembleDebug -PsbScreenShare=true
    if (screenShareEnabled) {
        implementation project(':screenshare')
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
